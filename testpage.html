<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Planet Orbits</title>

  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
    <script>
      // --- Scene and Camera ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 50, 150);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // --- Orbit Data ---
      const planetData = [
        {
          name: "Mercury",
          a: 0.387,
          e: 0.205,
          m: 0.0553,
          theta: 5.838312,
          inclination: 7.01,
        },
        {
          name: "Venus",
          a: 0.723,
          e: 0.007,
          m: 0.815,
          theta: 0.5000129,
          inclination: 3.39,
        },
        { name: "Earth", a: 1, e: 0.017, theta: 0, inclination: 0 },
        {
          name: "Mars",
          a: 1.524,
          e: 0.093,
          m: 0.107,
          theta: 4.062033,
          inclination: 1.85,
        },
        {
          name: "Jupiter",
          a: 5.203,
          e: 0.049,
            m: 317.8,
          theta: 1.303286,
          inclination: 1.31,
        },
        {
          name: "Saturn",
          a: 9.537,
          e: 0.054,
            m: 95.2,
          theta: 6.102573,
          inclination: 5.51,
        },
        {
          name: "Uranus",
          a: 19.189,
          e: 0.047,
            m: 14.5,
          theta: 1.186948,
          inclination: 6.48,
        },
        {
          name: "Neptune",
          a: 30.07,
          e: 0.01,
            m: 17.1,
          theta: 5.271201,
          inclination: 6.43,
        },
      ];

      planetData.forEach((data) => {




        // --- Create Orbit Path --- //




        const points = [];
        const a = data.a;
        const e = data.e;
        const m = data.m; // default mass if not provided
        const b = a * Math.sqrt(1 - e * e);
        const c = a * e;
        const resolution = 500;

        for (let t = 0; t <= 2 * Math.PI; t += (2 * Math.PI) / resolution) {
          let x = a * Math.cos(t) - c;
          let z = b * Math.sin(t);

          // Rotate by perihelion angle
          const xRot = x * Math.cos(data.theta) - z * Math.sin(data.theta);
          const zRot = x * Math.sin(data.theta) + z * Math.cos(data.theta);

          points.push(new THREE.Vector3(10 * xRot, 0, 10 * zRot));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          opacity: 0.5,
          transparent: true,
        });
        const line = new THREE.LineLoop(geometry, material);






        // --- Add Planet Spheres ---- //






        // --- Add a sphere for the planet at perihelion ---
        const planetGeometry = new THREE.SphereGeometry(0.5, 16, 16); // small ball
        const planetMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // red for now
        const planet = new THREE.Mesh(planetGeometry, planetMaterial);
        // Position at perihelion
        const perihelionX = (a - c) * 10; // scale by 10 like orbit
        const perihelionZ = 0;
        // Rotate by perihelion angle
        planet.position.x =
          perihelionX * Math.cos(data.theta) -
          perihelionZ * Math.sin(data.theta);
        planet.position.z =
          perihelionX * Math.sin(data.theta) +
          perihelionZ * Math.cos(data.theta);
        planet.position.y = 0; // you can tilt it later if you want

        const planetGroup = new THREE.Group();
        planetGroup.add(planet);
        planetGroup.add(line);

        // Apply inclination
        planetGroup.rotation.z = THREE.MathUtils.degToRad(data.inclination);




        data.mesh = planet;
        data.currentAngle = data.theta; // start at perihelion
        const orbitalPeriod = Math.sqrt(a * a * a); // in Earth years
        data.radius = 10 * planet.position.length(); // scaled orbit radius
        const r = data.radius;
        const angularMomentum = m * r * r * 











        scene.add(planetGroup);





      });

      // --- Add Sun ---
      const sunGeometry = new THREE.SphereGeometry(1, 32, 32);
      const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
      const sun = new THREE.Mesh(sunGeometry, sunMaterial);
      scene.add(sun);

      // --- Animation Loop ---
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      animate();

      // --- Handle Resize ---
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Camera control variables
      let radius = 10; // distance from the origin
      let theta = Math.PI / 4; // vertical angle
      let phi = Math.PI / 4; // horizontal angle
      const moveSpeed = 0.05;
      const zoomSpeed = 10;
      const minRadius = 5;
      const maxRadius = 50000;

      function updateCameraPosition() {
        // Spherical to Cartesian conversion
        camera.position.x = radius * Math.sin(theta) * Math.cos(phi);
        camera.position.y = radius * Math.cos(theta);
        camera.position.z = radius * Math.sin(theta) * Math.sin(phi);
        camera.lookAt(0, 0, 0);
      }

      // Mouse controls
      let isDragging = false;
      let previousMouseX = 0;
      let previousMouseY = 0;
      const dragSpeed = 0.005;

      window.addEventListener("mousedown", (event) => {
        isDragging = true;
        previousMouseX = event.clientX;
        previousMouseY = event.clientY;
      });

      window.addEventListener("mousemove", (event) => {
        if (!isDragging) return;

        const deltaX = event.clientX - previousMouseX;
        const deltaY = event.clientY - previousMouseY;

        phi -= deltaX * dragSpeed;
        theta -= deltaY * dragSpeed;
        theta = Math.max(0.1, Math.min(Math.PI - 0.1, theta)); // clamp

        updateCameraPosition();

        previousMouseX = event.clientX;
        previousMouseY = event.clientY;
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      // Zoom with mouse wheel
      window.addEventListener("wheel", (event) => {
        radius += event.deltaY * 0.1;
        radius = Math.max(minRadius, Math.min(maxRadius, radius));
        updateCameraPosition();
      });

      updateCameraPosition();
    </script>
  </body>
</html>
